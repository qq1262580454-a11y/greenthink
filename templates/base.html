<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Greenthink · {{ T.hero_h1 }}{% endblock %}</title>
<meta name="description" content="{{ T.footer_h2a }}{{ T.footer_h2b }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- ═══ 顶部导航 ═══ -->
<nav class="nav">
  <a class="nav-logo" href="/">
    <svg viewBox="0 0 24 24" class="nav-logo-icon" fill="none" aria-hidden="true">
      <path d="M4 20C4 9.5 11.5 5 20 4c-.6 8.5-6.5 13.8-16 16z" stroke="#689e84" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 20C8.5 13.5 12.8 9 19 5.5" stroke="#689e84" stroke-width="1.1" stroke-linecap="round"/>
    </svg>
    Greenthink
  </a>
  <div class="nav-right">
    <div class="nav-links">
      <a href="/works" class="{{ 'active' if active == 'works' else '' }}">{{ T.nav_works }}</a>
      <a href="/submit" class="{{ 'active' if active == 'submit' else '' }}">{{ T.nav_submit }}</a>
      {% if is_admin %}
      <a href="/admin">{{ T.admin_title }}</a>
      <a href="/admin/logout">{{ T.admin_logout }}</a>
      {% else %}
      <a href="/admin">{{ T.admin_title }}</a>
      {% endif %}
    </div>
    <a class="btn-nav" href="/submit">{{ T.nav_cta }}</a>
    <a class="lang-switch" href="/lang/{{ 'zh' if lang == 'en' else 'en' }}">{{ T.lang }}</a>
  </div>
</nav>

<main>
{% block content %}{% endblock %}
</main>

<!-- ═══ 页脚 ═══ -->
<footer class="footer">
  <h2>{{ T.footer_h2a }}<br>{{ T.footer_h2b }}</h2>
  <p class="foot-tagline">{{ T.footer_tag }}</p>
  <p class="foot-note">© 2026 Greenthink</p>
</footer>

<script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
